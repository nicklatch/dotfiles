unbind r
bind r source-file ~/.tmux.conf

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color*:Tc"

set -s escape-time 0
set -s extended-keys on
set -g prefix C-s
setw -g pane-base-index 1
set -g focus-events on
set -g status-interval 5
set -g base-index 1
set -g allow-rename on
set -g status-interval 1
set -g renumber-windows on
set -g mouse on
set -g set-titles on

set-window-option -g mode-keys vi

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

set -g status-style "fg=color15 bg=color0"
set -g window-status-current-style "fg=color2"
set -g window-status-format "#W"
set -g window-status-current-format "#[fg=colour6,bold]󰊓 #[fg=color2,bold]#W"

set -g status-position top
set -g status-justify "absolute-centre"

set -g status-left-length 100
set -g status-right-length 100

set -g status-right "#[fg=colour4,bold]#[bg=colour4,fg=colour0,bold] %I:%M %p "
set -g status-left "#{?client_prefix,#[bg=color2],#[bg=color0,bold]}#[bold]#{?client_prefix,#[fg=color0],#[bg=colour4,fg=colour0]} #S #{?client_prefix,#[fg=color2],#[fg=colour4]}#[bg=colour0,bold]"
set-window-option -g window-status-separator " #[fg=colour1]• "

set -g @tmux-which-key-disable-autobuild 0
set -g @tmux-which-key-xdg-enable 1

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'azorng/tmux-smooth-scroll'

run '~/.tmux/plugins/tpm/tpm'

# vim: ft=tmux
